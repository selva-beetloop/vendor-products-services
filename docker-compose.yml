# Single-node replica set: multi-document transactions (overall save, submit-qc, QC
# transitions) require one. A standalone mongod cannot serve this service.
services:
  mongo:
    image: mongo:7
    container_name: beetloop-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
    volumes:
      - beetloop-mongo-data:/data/db
volumes:
  beetloop-mongo-data:
