server:
  port: ${SERVER_PORT:8086}
  servlet:
    context-path: /vendor-products
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB

spring:
  application:
    name: vendor-products-services

  data:
    mongodb:
      database: ${SPRING_DATA_MONGODB_DATABASE:ProductService}
      auto-index-creation: true
      uuid-representation: standard

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
  codec:
    max-in-memory-size: 50MB

app:
  storage:
    root: ${UPLOAD_DIR:./data/uploads}
    max-file-size-bytes: 10485760
  cors:
    allowed-origins:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://*.beetloop.com
      - https://beetloop.com
  document-store:
    enabled: ${DOCUMENT_STORE_ENABLED:true}
    base-url: ${DOCUMENT_STORE_BASE_URL:https://dev.api.beetloop.com/document-store}

security:
  jwt:
    enabled: true
    mode: hmac
    secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
    allowed-token-types:
      - ACCESS
      - SERVICE
    public-endpoints:
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /api/marketplace/**
  role-permissions:
    enabled: true
    base-url: ${ADMIN_SERVICE_BASE_URL:http://localhost:8087}
    lookup-path: /admin/api/v1/roles
    fail-closed: true
    cache:
      maximum-size: 500
      expire-after-write: 10m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.beetloop.vendorproducts: INFO

---
spring:
  config:
    activate:
      on-profile: "!test"
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:beetloop%402026@20.219.145.243:27017,20.219.145.243:27018,20.219.145.243:27019/ProductService?replicaSet=rs0&authSource=admin}
