server:
  port: ${SERVER_PORT:8086}
  servlet:
    context-path: /vendor-products

spring:
  application:
    name: vendor-products-services

  datasource:
    url: jdbc:h2:file:./data/vendor-products;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

app:
  storage:
    root: ${UPLOAD_DIR:./data/uploads}
    max-file-size-bytes: 10485760
  cors:
    allowed-origins:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://*.beetloop.com
      - https://beetloop.com
  document-store:
    enabled: ${DOCUMENT_STORE_ENABLED:true}
    base-url: ${DOCUMENT_STORE_BASE_URL:https://dev.api.beetloop.com/document-store}

security:
  jwt:
    enabled: true
    mode: hmac
    secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
    allowed-token-types:
      - ACCESS
      - SERVICE
    public-endpoints:
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /h2-console/**
  role-permissions:
    enabled: true
    base-url: ${ADMIN_SERVICE_BASE_URL:http://localhost:8087}
    lookup-path: /admin/api/v1/roles
    fail-closed: true
    cache:
      maximum-size: 500
      expire-after-write: 10m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.beetloop.vendorproducts: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/vendor_products}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    public-endpoints:
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
