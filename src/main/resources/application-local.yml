# Local profile: HS256 tokens so the API is runnable without an IdP.
# Mint one with the helper in README.md ("Minting a local token").
beetloop:
  security:
    local-hs256-secret: ${LOCAL_JWT_SECRET:beetloop-local-development-secret-key-change-me-32b+}
  catalog:
    integration:
      demo-seed:
        # Gives the integrated frontend real rows on first load. Idempotent: writes only when the
        # vendor has no listings yet. Matches the frontend's local login bypass vendor id.
        enabled: ${DEMO_SEED_ENABLED:true}
        vendor-id: ${DEMO_SEED_VENDOR_ID:TEMP-VENDOR-001}
spring:
  security.oauth2.resourceserver.jwt.jwk-set-uri:
