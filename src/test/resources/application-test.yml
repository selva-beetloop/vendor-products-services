spring:
  datasource:
    url: jdbc:h2:mem:vendor-products-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  document-store:
    enabled: false
    base-url: http://localhost:18090/document-store
  cors:
    allowed-origins:
      - http://localhost:*

security:
  jwt:
    enabled: true
    mode: hmac
    secret: 01234567890123456789012345678901
    allowed-token-types:
      - ACCESS
    public-endpoints:
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
  role-permissions:
    enabled: false
