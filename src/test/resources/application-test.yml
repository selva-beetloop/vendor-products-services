de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.12

spring:
  data:
    mongodb:
      database: ProductServiceTest
      auto-index-creation: true
      uuid-representation: standard

app:
  document-store:
    enabled: false
    base-url: http://localhost:18090/document-store
  cors:
    allowed-origins:
      - http://localhost:*

security:
  jwt:
    enabled: true
    mode: hmac
    secret: 01234567890123456789012345678901
    allowed-token-types:
      - ACCESS
    public-endpoints:
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
  role-permissions:
    enabled: false
